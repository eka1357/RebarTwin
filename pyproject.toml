[project]
name = "rebartwin"
version = "0.1.0"
description = "Rebuilds the steel at Indian beam-column joints in 3D and proves IS 456 / IS 13920 detailing failures with geometry."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
ifc = ["ifcopenshell>=0.8"]

[project.scripts]
rebartwin = "rebartwin.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rebartwin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
